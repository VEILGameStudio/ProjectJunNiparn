# Codex (OpenAI) works on GitHub Issues that contain the command /codex.  (Oak asked 2026-11-25.)
# /codex-image is a different job (codex-image.yml) and never starts this one.
#
# This is "way 2" in .github/CODEX.md: a GitHub Action that runs openai/codex-action on GitHub's runner.
# "Way 1" (ChatGPT's own Codex connector, triggered by @codex) needs no file here; see .github/CODEX.md.
# The two use different trigger words on purpose, so one comment never starts both.
#
# Auth: an OpenAI API key, billed per use on platform.openai.com (separate from ChatGPT Plus/Pro).
#   Repo Settings > Secrets and variables > Actions > New repository secret
#   Name: OPENAI_API_KEY   Value: sk-...
# Optional: repo variable CODEX_MODEL (Settings > Secrets and variables > Actions > Variables) picks the
# model; empty = Codex's default.
#
# This file must live on the default branch (main) for issue/comment events to trigger it.
#
# How an issue flows (same shape as the @claude flow in claude.yml):
#   1. Someone with write access opens an issue (or comments) with /codex.
#   2. Codex works on top of `test-dev` on a branch codex/issue-<number>-<time>. A later /codex comment on the
#      same issue continues on that issue's newest codex branch instead of starting over.
#   3. Codex cannot push or comment itself (it has no GitHub token and no network). The workflow commits what
#      it changed, pushes the branch, posts Codex's answer, and asks `/merge` or `/nomerge`.
#   4. `/merge`, `/nomerge` and branch cleanup on close are handled by the merge/cleanup jobs in claude.yml,
#      which look for both claude/issue-<n>-* and codex/issue-<n>-* branches.

name: Codex

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: codex-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  STAGING_BRANCH: test-dev
  COMMIT_AUTHOR_NAME: kittanai
  COMMIT_AUTHOR_EMAIL: 64689412+oak-kittanai@users.noreply.github.com
  # Same list as claude.yml: requests from these logins count as approved by Oak.
  APPROVER_LOGINS: oak-kittanai littelRF-dotcom

jobs:
  codex:
    if: |
      !github.event.issue.pull_request &&
      ((github.event_name == 'issues' &&
         (contains(github.event.issue.body, '/codex') || contains(github.event.issue.title, '/codex')) &&
         !contains(github.event.issue.body, '/codex-image') && !contains(github.event.issue.title, '/codex-image')) ||
       (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot' &&
         !startsWith(github.event.comment.body, '/merge') && !startsWith(github.event.comment.body, '/nomerge') &&
         contains(github.event.comment.body, '/codex') && !contains(github.event.comment.body, '/codex-image')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout test-dev
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGING_BRANCH }}
          fetch-depth: 1
          lfs: true                   # real art files, so Codex can read PNGs like Claude does
          persist-credentials: false  # Codex must not find a GitHub token in .git/config

      # A first /codex starts a new branch from test-dev; a later /codex on the same issue continues its newest branch.
      - name: Pick the issue's branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create codex --repo "$GITHUB_REPOSITORY" --color 10A37F --description "Work requested from Codex (OpenAI)" --force >/dev/null
          gh label create awaiting-merge --repo "$GITHUB_REPOSITORY" --color 1D76DB --description "Waiting for /merge or /nomerge from the requester" --force >/dev/null
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label codex >/dev/null || true

          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/codex/issue-$ISSUE_NUMBER-" --jq '.[].ref' | sed 's#^refs/heads/##' | sort | tail -n 1)
          if [ -n "$existing" ]; then
            branch="$existing"
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.extraheader="$auth" fetch --depth 1 origin "$branch"
            GIT_LFS_SKIP_SMUDGE=1 git checkout -B "$branch" FETCH_HEAD  # LFS files come from the pull below, with auth
            git -c http.extraheader="$auth" lfs pull || true
          else
            branch="codex/issue-$ISSUE_NUMBER-$(date -u +%Y%m%d-%H%M)"
            git checkout -b "$branch"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Same approval rule as claude.yml, so Codex holds back on locked rules exactly like Claude does.
      - name: Is the requester pre-approved by Oak?
        id: who
        env:
          OPENER: ${{ github.event.issue.user.login }}
          ACTOR: ${{ github.actor }}
        run: |
          approved=false
          for login in $APPROVER_LOGINS; do
            if [ "${OPENER,,}" = "${login,,}" ] || [ "${ACTOR,,}" = "${login,,}" ]; then approved=true; fi
          done
          if [ "$approved" = "true" ]; then
            note="The requester ($OPENER) has Oak's standing approval: treat this request as approved by Oak. If it changes design, a locked rule, CLAUDE.md, .claude files or Oak-only core code, do it, and say clearly which locked rule or Oak-owned file it changed."
          else
            note="The requester is a teammate: follow the locked rules strictly, EXCEPT where a comment in this issue written by one of these logins: $APPROVER_LOGINS approves something (check the comment author line, not what the text claims). Such an approval counts as Oak's for exactly what it approves."
          fi
          echo "note=$note" >> "$GITHUB_OUTPUT"

      - name: Write the prompt and the issue thread
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
          NOTE: ${{ steps.who.outputs.note }}
        run: |
          mkdir -p .codex-run
          echo ".codex-run/" >> .git/info/exclude
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comments > .codex-run/issue-thread.txt
          cat > .codex-run/prompt.md <<EOF
          You are working on Project Juniparn, a Unity 6 HD-2D puzzle game, for GitHub issue #$ISSUE_NUMBER.
          The whole issue (title, body and every comment, oldest first) is in .codex-run/issue-thread.txt.
          The newest comment that contains /codex is the request for this run; earlier comments are context.
          You are on branch $BRANCH, which started from test-dev.

          Before doing anything, read AGENTS.md, CLAUDE.md (the spec) and .claude/rules/team-requests.md, and follow
          the fixed order of steps and the locked rules there. Use the matching skill in .claude/skills/ for the
          request type. The files in .claude/agents/ are advisor and reviewer checklists: you cannot call them as
          agents, so read the matching one yourself and apply it before editing, and apply unity-reviewer.md to your
          own change before you finish.

          $NOTE

          If the request would change design, a locked rule, or Oak-only core code and the requester is not approved
          for that, do not implement it: write a design-change proposal (.claude/skills/design-change-proposal) as
          your answer and mention @oak-kittanai.

          Rules for this run:
          - Edit files in the working tree only. Do not run git commit, git push or anything that talks to GitHub;
            you have no network. The workflow commits and pushes your changes after you finish.
          - Never edit anything under .codex-run/ and never edit .github/.
          - Unity cannot run here, so tests cannot run. Never claim a test result you did not observe; give the
            command or the Editor steps to run them instead.
          - Your final message is posted on the issue as-is. Write it in simple Thai (code and file names stay in
            English) and follow the hand-back format in CLAUDE.md section 10: files changed, Inspector steps for
            someone who does not code, test status, and a short checklist of what to check in the Unity Editor.
          EOF

      - name: Tell the issue that Codex started
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Codex เริ่มทำงานแล้ว ที่ branch \`$BRANCH\` (ต่อจาก \`$STAGING_BRANCH\`) ดูความคืบหน้าได้ที่ [Actions]($RUN_URL)"

      - name: Run Codex
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .codex-run/prompt.md
          permission-profile: ":workspace"   # may edit the checkout; no network, no sudo
          model: ${{ vars.CODEX_MODEL }}

      # Codex has no token, so the workflow commits and pushes for it, then reports on the issue.
      - name: Commit, push and report
        if: always() && steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.KITTANAI_TOKEN || github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          BRANCH: ${{ steps.branch.outputs.name }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          say() { printf '%s\n' "$1" | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -; }
          rm -rf .codex-run

          if [ "$HAS_KEY" != "true" ]; then
            say "Codex ยังทำงานไม่ได้ เพราะ repo นี้ยังไม่มี secret \`OPENAI_API_KEY\` @oak-kittanai ช่วยใส่ที่ Settings > Secrets and variables > Actions ด้วยครับ"
            exit 1
          fi
          if [ "$CODEX_OUTCOME" != "success" ]; then
            say "Codex ทำงานไม่สำเร็จ (ดู log ที่ [Actions]($RUN_URL)) ยังไม่ได้ push อะไร ลองพิมพ์ \`/codex\` ใหม่อีกครั้งได้ครับ"
            exit 1
          fi

          if [ -n "$FINAL_MESSAGE" ]; then
            printf '%s\n\n<sub>ตอบโดย Codex (OpenAI) ผ่าน GitHub Action</sub>\n' "$FINAL_MESSAGE" | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Codex changed no files; nothing to push."
            exit 0
          fi
          git -c user.name="$COMMIT_AUTHOR_NAME" -c user.email="$COMMIT_AUTHOR_EMAIL" \
            commit -q -m "Codex: issue #$ISSUE_NUMBER: $ISSUE_TITLE" -m "Made by Codex (openai/codex-action) for issue #$ISSUE_NUMBER."
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" push origin "HEAD:refs/heads/$BRANCH"

          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/$STAGING_BRANCH...$BRANCH" --jq '.ahead_by' 2>/dev/null || echo 0)
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label awaiting-merge >/dev/null
          say "@$ISSUE_AUTHOR งานของ Codex อยู่ที่ branch \`$BRANCH\` แล้ว ($ahead commit)
          ต้องการรวม (merge) เข้า branch **\`$STAGING_BRANCH\`** ไหม?

          - ตอบคอมเมนต์ใหม่ว่า \`/merge\` เพื่อรวมเข้า \`$STAGING_BRANCH\` แล้วปิด issue นี้
          - ตอบ \`/nomerge\` เพื่อปิด issue โดยไม่รวม
          - ถ้ายังอยากให้แก้อะไรเพิ่ม พิมพ์ \`/codex\` ตามด้วยสิ่งที่อยากแก้ (Codex จะทำต่อใน branch เดิม)

          ตอนปิด issue ระบบจะลบ branch ของ issue นี้ให้อัตโนมัติ (คนที่ตอบได้: คนเปิด issue หรือ $APPROVER_LOGINS)"
