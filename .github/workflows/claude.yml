# Claude answers GitHub Issues and PR comments that mention @claude.
#
# Auth: Oak's Claude Pro/Max subscription, not an API key.
#   1. Oak runs `claude setup-token` in a terminal and copies the token.
#   2. Repo Settings > Secrets and variables > Actions > New repository secret
#      Name: CLAUDE_CODE_OAUTH_TOKEN   Value: <the token>
# Usage counts against Oak's own plan limits.
#
# This file must live on the default branch (main) for issue/comment events to trigger it.
# Work happens on `dev`: Claude reads CLAUDE.md, .claude/rules and .claude/skills from there
# and opens its branches/PRs against dev.

name: Claude

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          lfs: true    # Claude needs real art files (PNG etc.) to crop/stretch sprites; uses LFS bandwidth

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: dev
          branch_prefix: claude/
          additional_permissions: |
            actions: read
          # No `prompt:` here on purpose: setting it switches the action to automation mode,
          # which ignores the @claude mention and never replies on the issue.
          # Oak approved (2026-11-03): let Claude run shell commands (Python/PIL, pip, git, etc.)
          # so it can process art and scripts like a local session. Unity itself still cannot run here.
          # Oak asked (2026-11-07): Task/Agent let Claude call the advisor and reviewer agents in .claude/agents/.
          claude_args: |
            --allowedTools "Bash,Read,Edit,MultiEdit,Write,Glob,Grep,LS,WebFetch,WebSearch,TodoWrite,Task,Agent"
            --append-system-prompt "You are working on Project Juniparn (Unity). Before doing anything: read CLAUDE.md (the spec) and follow .claude/rules/team-requests.md exactly, including its fixed order of steps and the locked rules; use the matching skill in .claude/skills/ for the request type. Before editing (types C, D, E) ask the matching advisor agent in .claude/agents/ and show its advice to the teammate; before handing back or opening a pull request, run the unity-reviewer agent and fix its blockers. When someone asks you to check or review a pull request, run the unity-reviewer agent on it and post its result. Reply to teammates in simple Thai; code, comments and file names stay in English. If the request would change design, a locked rule, or Oak-only core code, do not implement it: write a design-change proposal (design-change-proposal skill) as your reply and tag @oak-kittanai. Unity cannot run here, so say clearly what the teammate must check in the Editor. Open pull requests against dev, never main."
