name: สั่งงาน Codex (Request)
description: ขอให้ Codex (OpenAI) ทำงานให้ เหมือนสั่ง Claude แต่ใช้ Codex แทน
title: "[Codex] "
labels: ["codex"]
body:
  - type: markdown
    attributes:
      value: |
        Codex จะอ่าน `AGENTS.md`, `CLAUDE.md` และ `.claude/rules/team-requests.md` แล้วทำตามกฎเดียวกับ Claude
        **ต้องมีคำว่า `/codex` ในช่องสุดท้าย Codex ถึงจะเริ่มทำงาน** (ไม่ใช่ `@codex` ดูเหตุผลใน `.github/CODEX.md`)

        **ขั้นตอนหลังกดส่ง**
        1. Codex ทำงานต่อจาก branch `test-dev` ใน branch ชื่อ `codex/issue-<เลข>-<เวลา>`
        2. เสร็จแล้วจะโพสต์สรุปในนี้ และถามว่าจะรวมเข้า `test-dev` ไหม ตอบ `/merge` หรือ `/nomerge`
        3. อยากให้แก้เพิ่ม พิมพ์คอมเมนต์ใหม่ `/codex` ตามด้วยสิ่งที่อยากแก้ (ทำต่อใน branch เดิม)
        4. ตอนปิด issue ระบบจะลบ branch ของ issue นั้นให้อัตโนมัติ

        อยากได้ **รูป** อย่างเดียว (ไม่แก้โปรเจกต์) ใช้ฟอร์ม "สร้างรูปด้วย Codex" แทน
  - type: dropdown
    id: type
    attributes:
      label: ประเภทงาน
      options:
        - เพิ่มไอเท็ม (add-item)
        - เพิ่มบทพูด (add-dialogue)
        - เพิ่มของที่กดโต้ตอบได้ (add-interactable)
        - เพิ่มปริศนา (add-puzzle)
        - ตั้งค่าพื้นที่/ฉาก (setup-area)
        - นำเข้าภาพ sprite (import-sprite-art)
        - แก้บั๊ก (fix-bug)
        - เขียนเทสต์ (write-tests)
        - ขอเปลี่ยนดีไซน์ (ส่งให้ Oak)
        - อื่นๆ / ไม่แน่ใจ
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: อยากให้เกิดอะไรขึ้นในเกม
      description: เล่าว่าผู้เล่นจะเห็นหรือทำอะไร ไม่ต้องบอกว่าต้องแก้โค้ดตรงไหน
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: อยู่ตรงไหน
      description: ฉาก / พื้นที่ / ตัวละคร / ไอเท็มที่เกี่ยวข้อง
  - type: textarea
    id: bug
    attributes:
      label: (ถ้าเป็นบั๊ก) ทำยังไงให้เกิด และควรเป็นยังไง
  - type: textarea
    id: refs
    attributes:
      label: ไฟล์ / ลิงก์อ้างอิง
      description: บอก path ของไฟล์ในโปรเจกต์ได้เลย (Codex เปิดรูปที่แนบใน issue ไม่ได้ แต่อ่านไฟล์ใน repo ได้)
  - type: textarea
    id: mention
    attributes:
      label: เรียก Codex
      value: "/codex ช่วยทำงานนี้ตามกฎของทีม"
    validations:
      required: true
